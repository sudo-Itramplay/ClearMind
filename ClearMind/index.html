<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearMind — Estudi sense distraccions</title>

    <!-- Inter — font principal del nou sistema de disseny -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <!-- Aplica el tema guardat ABANS que React munti — evita el flash de mode incorrecte -->
    <script>
      try {
        var t = localStorage.getItem('clearmind-theme')
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
